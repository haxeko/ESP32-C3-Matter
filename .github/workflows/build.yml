name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build (esp32c3)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          idf.py set-target esp32c3
          idf.py build
          idf.py merge-bin -o matter_relay_merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matter_relay-esp32c3
          path: |
            build/matter_relay.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
            build/matter_relay_merged.bin
